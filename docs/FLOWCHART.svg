<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<rect width="1200" height="1800" fill="white"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">LPG Security System — Working Flowchart</text>
<text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="18" fill="#4b5563">Simple control flow for the ESP32 prototype</text>

<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#374151"/></marker>
</defs>

<!-- Helpers -->
<g font-family="Arial" font-size="18" fill="#111827" stroke="#374151" stroke-width="2">
  <rect x="430" y="125" width="340" height="70" rx="18" fill="#dbeafe"/>
  <text x="600" y="168" text-anchor="middle" stroke="none" font-weight="700">START</text>

  <rect x="350" y="230" width="500" height="130" rx="16" fill="#ecfdf5"/>
  <text x="600" y="262" text-anchor="middle" stroke="none" font-weight="700">Initialize ESP32</text>
  <text x="600" y="291" text-anchor="middle" stroke="none">Pins • MQ-6 • DHT11 • Flame</text>
  <text x="600" y="318" text-anchor="middle" stroke="none">OLED • LEDs • Buzzer • Relay • Servo • Fan</text>
  <text x="600" y="345" text-anchor="middle" stroke="none">Start Wi-Fi / Blynk connection attempts</text>

  <rect x="350" y="395" width="500" height="110" rx="16" fill="#f3e8ff"/>
  <text x="600" y="430" text-anchor="middle" stroke="none" font-weight="700">Read Sensors</text>
  <text x="600" y="458" text-anchor="middle" stroke="none">MQ-6 gas • DHT11 temperature/humidity</text>
  <text x="600" y="486" text-anchor="middle" stroke="none">Flame sensor</text>

  <rect x="350" y="540" width="500" height="110" rx="16" fill="#fff7ed"/>
  <text x="600" y="575" text-anchor="middle" stroke="none" font-weight="700">Process Readings</text>
  <text x="600" y="603" text-anchor="middle" stroke="none">Filter MQ-6 value and compare thresholds</text>
  <text x="600" y="631" text-anchor="middle" stroke="none">Evaluate gas / temperature / flame alarms</text>

  <polygon points="600,700 760,780 600,860 440,780" fill="#fef3c7"/>
  <text x="600" y="772" text-anchor="middle" stroke="none" font-weight="700">Any alarm?</text>
  <text x="600" y="800" text-anchor="middle" stroke="none">(Gas OR Temp OR Flame)</text>

  <rect x="100" y="930" width="410" height="280" rx="16" fill="#dcfce7"/>
  <text x="305" y="970" text-anchor="middle" stroke="none" font-weight="700">NORMAL MODE</text>
  <text x="125" y="1010" stroke="none">• Relay ON</text>
  <text x="125" y="1043" stroke="none">• Fan OFF</text>
  <text x="125" y="1076" stroke="none">• Servo = 90°</text>
  <text x="125" y="1109" stroke="none">• Buzzer OFF</text>
  <text x="125" y="1142" stroke="none">• Red/Blue OFF</text>
  <text x="125" y="1175" stroke="none">• Green solid when Wi-Fi connected</text>

  <rect x="690" y="930" width="410" height="330" rx="16" fill="#fee2e2"/>
  <text x="895" y="970" text-anchor="middle" stroke="none" font-weight="700">EMERGENCY MODE</text>
  <text x="715" y="1010" stroke="none">• Relay OFF</text>
  <text x="715" y="1043" stroke="none">• Fan ON</text>
  <text x="715" y="1076" stroke="none">• Servo = 0°</text>
  <text x="715" y="1109" stroke="none">• Buzzer ON</text>
  <text x="715" y="1142" stroke="none">• Green OFF</text>
  <text x="715" y="1175" stroke="none">• Red ↔ Blue flashing</text>
  <text x="715" y="1208" stroke="none">• OLED shows emergency status</text>
  <text x="715" y="1241" stroke="none">• Send Blynk emergency event</text>

  <rect x="350" y="1330" width="500" height="110" rx="16" fill="#e0f2fe"/>
  <text x="600" y="1365" text-anchor="middle" stroke="none" font-weight="700">Update OLED + Blynk</text>
  <text x="600" y="1393" text-anchor="middle" stroke="none">Gas • Temperature • Humidity • Flame</text>
  <text x="600" y="1421" text-anchor="middle" stroke="none">Relay • Fan • Servo • Emergency status</text>

  <polygon points="600,1495 760,1575 600,1655 440,1575" fill="#fef3c7"/>
  <text x="600" y="1567" text-anchor="middle" stroke="none" font-weight="700">Emergency still active?</text>

  <rect x="350" y="1680" width="500" height="70" rx="18" fill="#dbeafe"/>
  <text x="600" y="1723" text-anchor="middle" stroke="none" font-weight="700">Repeat continuous monitoring</text>
</g>

<!-- Arrows -->
<g stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)">
 <line x1="600" y1="195" x2="600" y2="230"/>
 <line x1="600" y1="360" x2="600" y2="395"/>
 <line x1="600" y1="505" x2="600" y2="540"/>
 <line x1="600" y1="650" x2="600" y2="700"/>
 <line x1="440" y1="780" x2="305" y2="930"/>
 <line x1="760" y1="780" x2="895" y2="930"/>
 <line x1="305" y1="1210" x2="450" y2="1330"/>
 <line x1="895" y1="1260" x2="750" y2="1330"/>
 <line x1="600" y1="1440" x2="600" y2="1495"/>
 <line x1="600" y1="1655" x2="600" y2="1680"/>
 <path d="M440 1575 H260 V450 H350"/>
 <path d="M1100 1095 H1145 V450 H850"/>
</g>

<g font-family="Arial" font-size="20" font-weight="700" fill="#111827">
 <text x="355" y="850">NO</text>
 <text x="775" y="850">YES</text>
 <text x="390" y="1665">NO</text>
 <text x="780" y="1650">YES</text>
</g>
<text x="40" y="1780" font-family="Arial" font-size="15" fill="#6b7280">Prototype note: MQ-6 is treated as a relative/ADC signal; thresholds must be calibrated for the actual sensor and environment.</text>
</svg>