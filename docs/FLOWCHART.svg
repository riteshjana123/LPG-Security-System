<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900">
<rect width="1200" height="1900" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#374151"/></marker></defs>
<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#111827">LPG Security System — Control Flow</text>
<text x="600" y="87" text-anchor="middle" font-family="Arial" font-size="18" fill="#4b5563">Automatic security mode and Blynk-controlled testing mode</text>

<g font-family="Arial" font-size="18" fill="#111827" stroke="#374151" stroke-width="2">
<rect x="430" y="125" width="340" height="68" rx="18" fill="#dbeafe"/><text x="600" y="167" text-anchor="middle" stroke="none" font-weight="700">START</text>
<rect x="330" y="225" width="540" height="125" rx="16" fill="#ecfdf5"/>
<text x="600" y="257" text-anchor="middle" stroke="none" font-weight="700">Initialize ESP32</text>
<text x="600" y="285" text-anchor="middle" stroke="none">Sensors • OLED • LEDs • Buzzer</text>
<text x="600" y="313" text-anchor="middle" stroke="none">Relay • Servo • Fan driver • Wi-Fi / Blynk</text>

<rect x="350" y="385" width="500" height="105" rx="16" fill="#f3e8ff"/>
<text x="600" y="420" text-anchor="middle" stroke="none" font-weight="700">Read Sensors</text>
<text x="600" y="448" text-anchor="middle" stroke="none">MQ-6 gas • DHT11 temperature/humidity</text>
<text x="600" y="476" text-anchor="middle" stroke="none">Flame sensor</text>

<polygon points="600,535 765,615 600,695 435,615" fill="#fef3c7"/>
<text x="600" y="608" text-anchor="middle" stroke="none" font-weight="700">Testing Mode?</text>
<text x="600" y="636" text-anchor="middle" stroke="none">V12 = 1</text>

<rect x="70" y="760" width="470" height="250" rx="16" fill="#e0f2fe"/>
<text x="305" y="800" text-anchor="middle" stroke="none" font-weight="700">TESTING MODE</text>
<text x="95" y="840" stroke="none">• Automatic actuator response overridden</text>
<text x="95" y="873" stroke="none">• V13 controls Fan</text>
<text x="95" y="906" stroke="none">• V14 controls Relay</text>
<text x="95" y="939" stroke="none">• V15 controls Servo angle (0–180°)</text>
<text x="95" y="972" stroke="none">• V16 controls Buzzer</text>
<text x="95" y="1005" stroke="none">• Sensor telemetry remains active</text>

<rect x="660" y="760" width="470" height="250" rx="16" fill="#fee2e2"/>
<text x="895" y="800" text-anchor="middle" stroke="none" font-weight="700">AUTOMATIC SECURITY MODE</text>
<text x="685" y="840" stroke="none">Evaluate Gas / Temperature / Flame</text>
<text x="685" y="873" stroke="none">Gas alarm OR Temp alarm OR Flame</text>
<text x="685" y="906" stroke="none">→ Emergency Mode</text>
<text x="685" y="939" stroke="none">Otherwise → Normal Mode</text>
<text x="685" y="972" stroke="none">Automatic safety response remains active</text>

<polygon points="895,1050 1045,1125 895,1200 745,1125" fill="#fef3c7"/>
<text x="895" y="1118" text-anchor="middle" stroke="none" font-weight="700">Any alarm?</text>

<rect x="690" y="1270" width="410" height="260" rx="16" fill="#fee2e2"/>
<text x="895" y="1310" text-anchor="middle" stroke="none" font-weight="700">EMERGENCY MODE</text>
<text x="715" y="1350" stroke="none">• Relay OFF</text>
<text x="715" y="1382" stroke="none">• Fan ON</text>
<text x="715" y="1414" stroke="none">• Servo = 0°</text>
<text x="715" y="1446" stroke="none">• Buzzer ON</text>
<text x="715" y="1478" stroke="none">• Green OFF; Red/Blue alternate</text>
<text x="715" y="1510" stroke="none">• Blynk event + phone notification</text>

<rect x="90" y="1270" width="470" height="260" rx="16" fill="#dcfce7"/>
<text x="325" y="1310" text-anchor="middle" stroke="none" font-weight="700">NORMAL MODE</text>
<text x="115" y="1350" stroke="none">• Relay ON</text>
<text x="115" y="1382" stroke="none">• Fan OFF</text>
<text x="115" y="1414" stroke="none">• Servo = 90°</text>
<text x="115" y="1446" stroke="none">• Buzzer OFF</text>
<text x="115" y="1478" stroke="none">• Green solid if Wi-Fi connected</text>
<text x="115" y="1510" stroke="none">• Green blinks while disconnected/connecting</text>

<rect x="340" y="1590" width="520" height="105" rx="16" fill="#f3e8ff"/>
<text x="600" y="1625" text-anchor="middle" stroke="none" font-weight="700">Update OLED + Blynk</text>
<text x="600" y="1653" text-anchor="middle" stroke="none">Gas • LPG Leakage • Fire • Temperature • Outputs</text>
<text x="600" y="1681" text-anchor="middle" stroke="none">Continue monitoring</text>

<polygon points="600,1735 760,1810 600,1885 440,1810" fill="#fef3c7"/>
<text x="600" y="1803" text-anchor="middle" stroke="none" font-weight="700">Continue?</text>
</g>

<g stroke="#374151" stroke-width="3" fill="none" marker-end="url(#a)">
<line x1="600" y1="193" x2="600" y2="225"/>
<line x1="600" y1="350" x2="600" y2="385"/>
<line x1="600" y1="490" x2="600" y2="535"/>
<line x1="435" y1="615" x2="305" y2="760"/>
<line x1="765" y1="615" x2="895" y2="760"/>
<line x1="895" y1="1010" x2="895" y2="1050"/>
<line x1="895" y1="1200" x2="895" y2="1270"/>
<line x1="745" y1="1125" x2="325" y2="1270"/>
<line x1="325" y1="1530" x2="470" y2="1590"/>
<line x1="895" y1="1530" x2="730" y2="1590"/>
<line x1="600" y1="1695" x2="600" y2="1735"/>
<path d="M440 1810 H180 V440 H350"/>
</g>

<g font-family="Arial" font-size="19" font-weight="700" fill="#111827">
<text x="325" y="735">YES</text>
<text x="770" y="735">NO</text>
<text x="920" y="1240">YES</text>
<text x="600" y="1235">NO → NORMAL</text>
<text x="780" y="1850">NO → repeat</text>
<text x="310" y="1040">Sensors still monitored</text>
</g>

<text x="60" y="184" font-family="Arial" font-size="14" fill="#6b7280"></text>
</svg>